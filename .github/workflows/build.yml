name: Build, Test & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  MC_VERSION: "26.3"

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build JAR and run unit tests
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: build/reports/tests/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: FishEverything
          path: build/libs/FishEverything-*.jar
          if-no-files-found: error

  server-test:
    name: Live server test on Paper 26.3
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: FishEverything
          path: server/plugins

      - name: Download Paper ${{ env.MC_VERSION }}
        working-directory: server
        run: |
          UA="FishEverything-CI (https://github.com/${GITHUB_REPOSITORY})"
          BUILD_JSON=$(curl -fsSL -H "User-Agent: ${UA}" \
            "https://fill.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds/latest")
          URL=$(echo "$BUILD_JSON" | jq -r '.downloads."server:default".url')
          SHA=$(echo "$BUILD_JSON" | jq -r '.downloads."server:default".checksums.sha256')
          echo "Paper build: $(echo "$BUILD_JSON" | jq -r '.id') ($(echo "$BUILD_JSON" | jq -r '.channel'))"
          curl -fsSL -H "User-Agent: ${UA}" -o paper.jar "$URL"
          echo "${SHA}  paper.jar" | sha256sum -c -

      - name: Configure test server
        working-directory: server
        run: |
          echo "eula=true" > eula.txt
          cat > server.properties <<'EOF'
          online-mode=false
          level-type=minecraft\:flat
          generate-structures=false
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          max-players=1
          EOF

      - name: Run server with self-test
        working-directory: server
        run: |
          set +e
          timeout 900 java -Xms1G -Xmx2G -Dfisheverything.selftest=true -jar paper.jar --nogui < /dev/null
          echo "server exit code: $?"
          exit 0

      - name: Check results
        working-directory: server
        run: |
          fail=0
          echo "::group::Self-test report"
          cat plugins/FishEverything/selftest-result.txt || true
          echo "::endgroup::"

          if ! head -n1 plugins/FishEverything/selftest-result.txt 2>/dev/null | grep -qx PASS; then
            echo "::error::Self-test did not pass"; fail=1
          fi
          if ! grep -q "Enabling FishEverything" logs/latest.log; then
            echo "::error::Plugin never enabled"; fail=1
          fi
          if grep -nE "at net\.kalob\.FishEverything|Error occurred while enabling FishEverything|Could not load .*FishEverything" logs/latest.log; then
            echo "::error::Plugin errors found in server log"; fail=1
          fi
          if [ -d crash-reports ] && [ -n "$(ls -A crash-reports)" ]; then
            echo "::error::Server crashed"; ls crash-reports; fail=1
          fi
          exit $fail

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-logs
          path: |
            server/logs/
            server/crash-reports/
            server/plugins/FishEverything/selftest-result.txt
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: [build, server-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v4
        with:
          name: FishEverything
          path: dist

      # Every push to main refreshes the "latest" release so there's always a
      # stable download link: /releases/download/latest/FishEverything.jar
      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp dist/FishEverything-*.jar dist/FishEverything.jar
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/FishEverything.jar \
            --target "${GITHUB_SHA}" \
            --title "Latest build" \
            --notes "Automatic build of \`main\` at ${GITHUB_SHA::7}, tested on a live Paper ${MC_VERSION} server. Needs Paper ${MC_VERSION} on Java 25. Drop the JAR into your server's \`plugins\` folder." \
            --latest

      # Pushing a tag like v1.0.0 creates a permanent versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/FishEverything-*.jar \
            --title "FishEverything ${GITHUB_REF_NAME}" \
            --generate-notes
