  legendary:
    weight: 0.9
    display: "<gradient:#FFD700:#FF8C00><bold>LEGENDARY</bold></gradient>"
    max-amount: 1
    broadcast: true
    items:
      - "netherite_*"
      - "elytra"
      - "beacon"
      - "conduit"
      - "trident"
      - "heart_of_the_sea"
      - "dragon_head"
      - "wither_skeleton_skull"
      - "*_smithing_template"
