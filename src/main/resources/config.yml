    display: "<light_purple><bold>EPIC</bold></light_purple>"
    max-amount: 1
    broadcast: false
    items:
      - "*diamond*"
      - "emerald_block"
      - "ancient_debris"
      - "shulker_shell"
      - "*shulker_box"
      - "golden_apple"
      - "echo_shard"
      - "enchanted_book"
      - "*_spawn_egg"
      - "experience_bottle"
      - "*_skull"
      - "*_head"
      - "ominous_trial_key"
      - "ominous_bottle"
      - "recovery_compass"
      - "sniffer_egg"
