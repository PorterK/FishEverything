      - "*emerald*"
      - "*lapis*"
      - "*amethyst*"
      - "*_ore"
      - "ender_pearl"
      - "ender_eye"
      - "blaze_rod"
      - "breeze_rod"
      - "wind_charge"
      - "ghast_tear"
      - "name_tag"
      - "saddle"
      - "*_horse_armor"
      - "wolf_armor"
      - "nautilus_shell"
      - "*_pottery_sherd"
      - "*_banner_pattern"
      - "phantom_membrane"
      - "rabbit_foot"
      - "obsidian"
      - "crying_obsidian"
      - "end_crystal"
      - "turtle_helmet"
      - "spyglass"
      - "*_bucket"
      - "trial_key"
